<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Application d'Appel WebRTC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!--
      Écran d'accueil uniquement.
      Les interfaces d'appel (audio / entrant / vidéo) sont injectées par CallManager.js
      — ne pas les dupliquer ici, sinon CallManager refuse d'injecter son HTML complet
      (bascule caméra, haut-parleur, badges, etc.).
    -->
  <div class="container">
    <h2>Appel Audio P2P</h2>
    <!-- Les éléments audio distants sont aussi créés par CallManager ; on garde
           remoteAudio ici pour compatibilité si besoin. -->
    <audio id="remoteAudio" autoplay playsinline></audio>

    <!-- Mon ID généré -->
    <div class="card">
      <span class="label">Votre ID d'installation :</span>
      <div id="my-id-display" class="id-box">Génération...</div>
      <button id="btn-copy" type="button" onclick="copyMyId()">
        Copier mon ID
      </button>
    </div>

    <!-- Zone pour composer un ID -->
    <div class="card">
      <label for="target-id-input">ID du destinataire (plusieurs IDs séparés par une virgule = appel de groupe) :</label>
      <input type="text" id="target-id-input" placeholder="Ex: ID-111 ou ID-111, ID-222" />

      <!-- ===== BOUTONS D'APPEL ======================================
           Uniquement 2 actions sur l'écran d'accueil :
             - Appel audio  -> makeCall()      (CallManager.makeCall(false))
             - Appel vidéo  -> makeVideoCall() (CallManager.makeCall(true))
           Les autres boutons (Couper le serveur, Raccrocher, Voir localStorage)
           ont été retirés : le raccrochage se fait depuis les écrans d'appel
           (interface-1 / interface-3) injectés par CallManager.js.
      ============================================================= -->
      <div class="actions">
        <button id="btn-call" class="btn-green" type="button" onclick="makeCall()">
          📞 Appel audio
        </button>
        <button id="btn-video-call" class="btn-green" type="button" onclick="makeVideoCall()">
          🎥 Appel vidéo
        </button>
        <button id="btn-meeting-create" class="btn-green" type="button" onclick="showMeetingCreateView()">
          📅 Créer une réunion
        </button>
        <button id="btn-meeting-join" class="btn-green" type="button" onclick="showMeetingJoinView()">
          📅 Rejoindre une réunion
        </button>
        
      </div>
    </div>

    <!-- Indicateur de statut (CallManager met aussi à jour .status-bar) -->
    <div id="status" class="status-bar">Hors ligne</div>
  </div>

  <script src="cordova.js"></script>
  <script src="js/effet.js"></script>
  <!-- CallManager remplace l'ancien index.js : HTML+CSS+WebRTC+UI complets -->
  <script src="js/CallManager.js"></script>
  <!-- Extensions pour les réunions planifiées -->
  <script src="js/Meetings.js"></script>
</body>

</html>
